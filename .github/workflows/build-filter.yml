name: Build OEIAT-Watchlist-Internet - AdGuard Filter
permissions:
  contents: write
on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download CSV
        run: |
          URL="https://www.watchlist-internet.at/liste-betruegerischer-shops/csv/"
          echo "Lade Watchlist CSV herunter..."
          HTTP_CODE=$(curl -sSL \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: text/csv,application/csv,text/plain,*/*" \
            -H "Accept-Language: de-AT,de;q=0.9,en;q=0.8" \
            -H "Referer: https://www.watchlist-internet.at/" \
            -H "Cache-Control: no-cache" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" \
            -o data.csv.tmp \
            -w "%{http_code}" \
            "$URL")
          echo "HTTP-Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Download fehlgeschlagen (HTTP $HTTP_CODE)"
            head -c 500 data.csv.tmp || true
            exit 1
          fi
          if [ ! -s data.csv.tmp ]; then
            echo "::error::CSV-Datei ist leer."
            exit 1
          fi
          if head -c 512 data.csv.tmp | grep -qiE '<!DOCTYPE html|<html|cloudflare'; then
            echo "::error::HTML statt CSV erhalten."
            head -c 500 data.csv.tmp
            exit 1
          fi
          mv data.csv.tmp data.csv
          echo "Download erfolgreich."
          echo "Dateigröße:"
          wc -c data.csv
      - name: Convert to filter.txt
        run: python3 convert.py
      - name: Update & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.txt
          # Nur committen, wenn sich die Datei geändert hat
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Update filter ($(date -u +%Y-%m-%dT%H:%M:%SZ)) [$(grep -c '^||' filter.txt) domains]"
          git pull --rebase origin main
          git push origin main
