name: Build OEIAT-Watchlist-Internet - AdGuard Filter
permissions:
  contents: write

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download CSV
      run: |
        curl -fsSL --retry 3 --retry-delay 10 \
          -A "OEIAT-Filter-Bot/1.0 (+https://github.com/AlexPhBit/OEIAT-Watchlist-Internet---Filter)" \
          "https://www.watchlist-internet.at/liste-betruegerischer-shops/csv/" -o data.csv

    - name: Convert to filter.txt
      run: python3 convert.py

    - name: Update & Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add filter.txt

        # Nur committen, wenn sich die Datei geändert hat
        if git diff --cached --quiet; then
          echo "Keine Änderungen"
          exit 0
        fi

        git commit -m "Update filter ($(date -u +%Y-%m-%dT%H:%M:%SZ)) [$(grep -c '^||' filter.txt) domains]"
        git pull --rebase origin main
        git push origin main
