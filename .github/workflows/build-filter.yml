name: Build OEIAT-Watchlist-Internet - AdGuard Filter

permissions:
  contents: write

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSV
        run: |
          URL="https://www.watchlist-internet.at/liste-betruegerischer-shops/csv/"

          echo "Lade Watchlist CSV herunter..."

          curl -fSL \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Cache-Control: no-cache" \
            -A "Mozilla/5.0 (compatible; OEIAT-Filter-Bot/1.0)" \
            "$URL" \
            -o data.csv

          echo "Download abgeschlossen."

          echo "Dateigröße:"
          wc -c data.csv

          echo "Erste Zeilen:"
          head -n 5 data.csv

          # HTML-Erkennung
          if head -c 512 data.csv | grep -qiE '<!DOCTYPE html|<html|<head|cloudflare'; then
            echo "::error::Download enthält HTML statt CSV."
            exit 1
          fi

          # Mindestgröße
          if [ "$(wc -c < data.csv)" -lt 10000 ]; then
            echo "::error::CSV-Datei ist ungewöhnlich klein."
            exit 1
          fi

      - name: Convert to filter.txt
        run: python3 convert.py
      
      - name: Update & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add filter.txt

          # Nur committen, wenn sich die Datei geändert hat
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi

          git commit -m "Update filter ($(date -u +%Y-%m-%dT%H:%M:%SZ)) [$(grep -c '^||' filter.txt) domains]"
          git pull --rebase origin main
          git push origin main
